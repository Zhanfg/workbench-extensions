name: Publish staged extension

on:
  push:
    branches: [main]
    paths:
      - ".staging/**"
      - ".github/workflows/publish-staged-extension.yml"

permissions:
  contents: write

concurrency:
  group: publish-staged-extension
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out distribution repository
        uses: actions/checkout@v4

      - name: Reassemble and verify novel extension
        shell: bash
        run: |
          set -euo pipefail
          staging=".staging/org.workbench.novel-0.2.0"
          output="packages/org.workbench.novel/0.2.0/org.workbench.novel-0.2.0.wpack"

          if [ ! -d "$staging" ]; then
            echo "No staged payload remains; nothing to publish."
            exit 0
          fi

          mkdir -p "$(dirname "$output")"
          cat "$staging"/part-*.b64 | base64 --decode > "$output"

          actual_size="$(stat -c '%s' "$output")"
          [ "$actual_size" = "36728" ] || {
            echo "Unexpected package size: $actual_size" >&2
            exit 1
          }

          actual_sha="$(sha256sum "$output" | awk '{print $1}')"
          [ "$actual_sha" = "2d5204a3a940aa6df4ea0e1bff8b3a86026d49cbebc034d95da8b89afc878280" ] || {
            echo "Unexpected package SHA-256: $actual_sha" >&2
            exit 1
          }

          python - <<'PY'
          import json, zipfile
          path = "packages/org.workbench.novel/0.2.0/org.workbench.novel-0.2.0.wpack"
          required = {"pack.json", "module.json", "index.js", "integrity.json", "README.md"}
          with zipfile.ZipFile(path) as archive:
              names = set(archive.namelist())
              missing = required - names
              if missing:
                  raise SystemExit(f"Missing package entries: {sorted(missing)}")
              archive.testzip()
              pack = json.loads(archive.read("pack.json"))
              if pack.get("id") != "org.workbench.novel" or pack.get("version") != "0.2.0":
                  raise SystemExit("Package identity mismatch")
          PY

          rm -rf "$staging"

      - name: Commit immutable package
        shell: bash
        run: |
          set -euo pipefail
          git add packages .staging
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "Workbench Extension Publisher"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "release: publish org.workbench.novel 0.2.0"
          git push
