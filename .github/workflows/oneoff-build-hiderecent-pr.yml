name: One-off Build HideRecent Hardened PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - '.staging/hiderecent/trigger.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout carrier main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout HideRecent v2.1.2
        uses: actions/checkout@v4
        with:
          repository: Young-Lord/hideRecent
          ref: v2.1.2
          path: upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: upstream/**/*.gradle*

      - name: Apply hardened hook
        shell: bash
        run: |
          set -euo pipefail
          cp .staging/hiderecent/MainHook_hardened_v2.1.2.kt upstream/app/src/main/java/moe/lyniko/hiderecent/MainHook.kt
          diff -u <(git -C upstream show HEAD:app/src/main/java/moe/lyniko/hiderecent/MainHook.kt) upstream/app/src/main/java/moe/lyniko/hiderecent/MainHook.kt > /tmp/hiderecent-hardening.patch || true

      - name: Build debug APK
        id: gradle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd upstream
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee /tmp/hiderecent-build.log

      - name: Prepare success output
        if: steps.gradle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hiderecent-out
          APK="$(find upstream/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" /tmp/hiderecent-out/HideRecent-2.1.2-hardened-debug.apk
          cp /tmp/hiderecent-hardening.patch /tmp/hiderecent-out/hiderecent-hardening.patch
          sha256sum /tmp/hiderecent-out/HideRecent-2.1.2-hardened-debug.apk | tee /tmp/hiderecent-out/SHA256SUMS.txt
          printf 'BUILD_OK\nsource=Young-Lord/hideRecent@v2.1.2\n' > /tmp/hiderecent-out/BUILD_STATUS.txt

      - name: Publish success to artifact branch
        if: steps.gradle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf upstream
          git fetch origin artifacts/hiderecent-2.1.2-hardened-20260820
          git checkout -B artifacts/hiderecent-2.1.2-hardened-20260820 origin/artifacts/hiderecent-2.1.2-hardened-20260820
          rm -rf .build-artifacts/hiderecent-2.1.2-hardened
          mkdir -p .build-artifacts/hiderecent-2.1.2-hardened
          cp -a /tmp/hiderecent-out/. .build-artifacts/hiderecent-2.1.2-hardened/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build-artifacts/hiderecent-2.1.2-hardened
          git commit -m 'build: publish HideRecent 2.1.2 hardened APK'
          git push origin HEAD:artifacts/hiderecent-2.1.2-hardened-20260820

      - name: Publish failure to artifact branch
        if: steps.gradle.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          { echo BUILD_FAILED; echo; tail -n 700 /tmp/hiderecent-build.log 2>/dev/null || true; } > /tmp/BUILD_FAILED.txt
          rm -rf upstream
          git fetch origin artifacts/hiderecent-2.1.2-hardened-20260820
          git checkout -B artifacts/hiderecent-2.1.2-hardened-20260820 origin/artifacts/hiderecent-2.1.2-hardened-20260820
          rm -rf .build-artifacts/hiderecent-2.1.2-hardened
          mkdir -p .build-artifacts/hiderecent-2.1.2-hardened
          cp /tmp/BUILD_FAILED.txt .build-artifacts/hiderecent-2.1.2-hardened/BUILD_FAILED.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .build-artifacts/hiderecent-2.1.2-hardened/BUILD_FAILED.txt
          git commit -m 'build: record HideRecent build failure'
          git push origin HEAD:artifacts/hiderecent-2.1.2-hardened-20260820

      - name: Upload Actions artifact
        if: steps.gradle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: HideRecent-2.1.2-hardened-apk
          path: /tmp/hiderecent-out/
          retention-days: 1

      - name: Mark build failed
        if: steps.gradle.outcome != 'success'
        run: exit 1
